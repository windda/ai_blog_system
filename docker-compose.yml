# ============================================================
# Docker Compose - AI 博客系统（SQLite 一键部署版）
#
# 启动命令：docker compose up -d
# 访问地址：http://localhost:9000
# 默认账号：admin / admin123
#
# 说明：
#   - 单容器跑整套前后端（Flask 同源托管 Vue 前端）；
#   - 数据库 SQLite（持久化到 sqlite_data 卷），缓存内存版 Redis；
#   - 如需 MySQL + Redis 架构，见 docker-compose.mysql.yml。
#
# 可选环境变量（.env 文件）：
#   DEEPSEEK_API_KEY=sk-xxx   # 平台全局 Key（也可登录后台填写，加密存数据库）
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-blog
    ports:
      - "9000:9000"
    volumes:
      - sqlite_data:/app/instance       # SQLite 数据库持久化
      - uploads_data:/app/uploads        # 上传文件持久化
    environment:
      - TZ=Asia/Shanghai
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  sqlite_data:
  uploads_data:
