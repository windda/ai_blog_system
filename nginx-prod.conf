# ============================================================
# Nginx 生产环境配置文件
# 
# 功能：
# 1. 前端静态文件托管（Vue 编译后的 dist）
# 2. 后端 Flask API 反向代理
# 3. 静态资源缓存（图片/CSS/JS/字体）
# 4. 请求限流（防恶意请求）
# 5. HTTPS 适配（配合 certbot 使用）
# 6. Gzip 压缩
# 
# 部署步骤见底部注释
# ============================================================

# 限流配置：单个IP每秒最多10个请求，突发20个
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# 连接数限制：单个IP最多20个并发连接
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

upstream flask_backend {
    # Flask 后端服务器（可扩展多台）
    server 127.0.0.1:9000 weight=1 max_fails=3 fail_timeout=30s;
    # server 127.0.0.1:9001 weight=1 max_fails=3 fail_timeout=30s;  # 扩展节点
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    # server_name yourdomain.com;  # 生产环境改为实际域名

    # 日志
    access_log /var/log/nginx/blog_access.log;
    error_log /var/log/nginx/blog_error.log;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # ============================================================
    # 静态资源缓存（基于路径前缀，带缓存头）
    # ============================================================
    location /static/ {
        root /var/www/blog/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        limit_except GET HEAD { deny all; }
    }

    # ============================================================
    # 前端静态文件（history 模式兜底，必须放在最后）
    # ============================================================
    location / {
        root /var/www/blog/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        limit_except GET HEAD { deny all; }
    }

    # ============================================================
    # API 反向代理到 Flask 后端（优先匹配）
    # ============================================================
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        
        # 限流和连接数限制
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 20;
    }

    # ============================================================
    # 上传文件访问
    # ============================================================
    location /uploads/ {
        proxy_pass http://flask_backend/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ============================================================
    # 健康检查端点
    # ============================================================
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ============================================================
    # 错误页面
    # ============================================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ============================================================
# HTTPS 配置（配合 certbot 使用）
# 
# 使用方式：
#   1. 安装 certbot: apt install certbot python3-certbot-nginx
#   2. 生成证书: certbot --nginx -d yourdomain.com
#   3. certbot 会自动修改此配置文件，添加 SSL 配置
# 
# 手动 HTTPS 配置示例（取消注释以下内容）：
# ============================================================
# server {
#     listen 443 ssl http2;
#     server_name yourdomain.com;
# 
#     ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#     ssl_prefer_server_ciphers on;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 10m;
# 
#     # 其余配置与 80 端口相同
#     location / { ... }
#     location /api/ { ... }
# }
# 
# # HTTP 自动跳转 HTTPS
# server {
#     listen 80;
#     server_name yourdomain.com;
#     return 301 https://$server_name$request_uri;
# }


